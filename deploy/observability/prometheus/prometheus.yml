global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: local

scrape_configs:
  - job_name: daylik-app
    static_configs:
      - targets: ["otel-collector:8889"]

  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8888"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: loki
    static_configs:
      - targets: ["loki:3100"]
